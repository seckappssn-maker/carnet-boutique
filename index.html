<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: carnet de caisse mobile — en-tête collant, contenu en colonne, 5 onglets en bas, fenêtres qui montent du bas */
:root{
  --bg:#F2F4EF; --card:#FFFFFF; --ink:#16231D; --muted:#5E6B64; --line:#DCE2DA;
  --accent:#0B6E5B; --accent-soft:#DDEFE8; --on-accent:#FFFFFF; --debt:#B9741A; --debt-soft:#F7EBD8;
  --danger:#B4382F; --danger-soft:#F7E1DE; --ok:#2E7D4F;
  --display:'Bricolage Grotesque',ui-rounded,system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --card:#18221D; --ink:#E8EEEA; --muted:#97A59D; --line:#2A3630;
  --accent:#3FB596; --accent-soft:#163329; --on-accent:#06130E; --debt:#E0A34B; --debt-soft:#33281A;
  --danger:#EE7B70; --danger-soft:#3A1F1C; --ok:#62C08A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --card:#18221D; --ink:#E8EEEA; --muted:#97A59D; --line:#2A3630;
  --accent:#3FB596; --accent-soft:#163329; --on-accent:#06130E; --debt:#E0A34B; --debt-soft:#33281A;
  --danger:#EE7B70; --danger-soft:#3A1F1C; --ok:#62C08A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:8px 10px;justify-content:space-between;flex-wrap:wrap}
.brand{flex:1 1 150px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap;border:0;cursor:pointer}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--debt-soft);color:var(--debt)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qb{border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 6px;font-weight:700;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;overflow-wrap:anywhere;text-align:center}
.qb span{font-weight:600;font-size:12.5px;color:var(--ink)}
.chk{display:flex;flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--ink);font-weight:600}
.chk input{width:22px;height:22px;flex:none}
.sync{font-size:12.5px;font-weight:700;padding:5px 8px;border-radius:99px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}.sync.err{background:var(--danger-soft);color:var(--danger)}.sync.wait{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.chip.lang{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
h2{font-family:var(--display);font-weight:800;font-size:24px;margin:18px 0 10px;text-wrap:balance}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat .k{font-size:14.5px;color:var(--muted)}
.stat .v{font-family:var(--display);font-weight:800;font-size:22px;margin-top:2px;overflow-wrap:anywhere}
.stat.debt .v{color:var(--debt)} .stat.cash .v{color:var(--accent)} .stat.bad .v{color:var(--danger)}
.stat.wide{grid-column:1/-1}
.lw{color:var(--danger)!important;font-weight:700!important}.lw:empty{display:none}
#printArea{display:none}
#pdfArea.tick{width:420px;padding:22px 20px;white-space:pre-wrap;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace}
.prev{max-height:58vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px}.prev img{display:block;width:100%;height:auto}
#pdfArea{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#000;font:14px/1.4 system-ui,-apple-system,sans-serif;padding:0;color-scheme:light}
#pdfArea .rep h1{font-size:26px;margin:0}#pdfArea .sub{color:#444;margin-bottom:8px}#pdfArea h2{font-size:19px;margin:8px 0 12px;color:#000}#pdfArea h3{font-size:15px;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:#000}
#pdfArea table{width:100%;border-collapse:collapse}#pdfArea th,#pdfArea td{border-bottom:1px solid #ccc;padding:5px 6px;text-align:left;color:#000}#pdfArea th{background:#eee}#pdfArea td.n{text-align:right;white-space:nowrap}
#pdfArea .kpi{display:flex;flex-wrap:wrap;gap:8px}#pdfArea .kpi div{border:1px solid #999;border-radius:8px;padding:7px 10px;flex:1 1 30%}#pdfArea .kpi span{display:block;font-size:12px;color:#444}#pdfArea .kpi b{font-size:18px}
#pdfArea .e{color:#666;margin:3px 0}#pdfArea .foot{margin-top:18px;color:#666;font-size:12px}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;color:#000;font:11px/1.35 system-ui,-apple-system,sans-serif}
#printArea .rep h1{font-size:20px;margin:0}#printArea .sub{color:#444;margin-bottom:6px}#printArea h2{font-size:15px;margin:6px 0 10px}#printArea h3{font-size:12.5px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em}
#printArea table{width:100%;border-collapse:collapse}#printArea th,#printArea td{border-bottom:1px solid #ccc;padding:3px 4px;text-align:left}#printArea th{background:#eee}#printArea td.n{text-align:right;white-space:nowrap}
#printArea .kpi{display:flex;flex-wrap:wrap;gap:6px}#printArea .kpi div{border:1px solid #999;border-radius:6px;padding:5px 8px;flex:1 1 30%}#printArea .kpi span{display:block;font-size:10px;color:#444}#printArea .kpi b{font-size:14px}
#printArea .e{color:#666;margin:2px 0}#printArea .foot{margin-top:14px;color:#666;font-size:9.5px}#printArea tr{page-break-inside:avoid}#printArea pre{font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;margin:0;color:#000}@page{margin:3mm}html,body{background:#fff!important}:root{padding:0!important}}
.card.pay{margin-top:12px}
.btn.enc{font-size:20px;padding:18px 16px;font-family:var(--display);font-weight:800}
.segb.bill{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:700}
details.cli{margin-top:12px;background:var(--card)}
.big-form label.f,.big-form .f{font-size:15.5px;color:var(--ink)}
.big-form input,.big-form select{font-size:18px;padding:13px 14px}
.big-form .grid2{align-items:end}
.opt{font-weight:500;color:var(--muted);font-size:13.5px}
.gain{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.gain.up{background:var(--accent-soft);color:var(--accent)}.gain.down{background:var(--danger-soft);color:var(--danger)}
details.more{border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
details.more summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}details.more[open] summary::before{content:"− "}
label.f:has(input[type="date"]){overflow:hidden}
input[type="date"]{width:100%!important;min-width:0!important;box-sizing:border-box}
.qb.amt{background:var(--debt-soft);color:var(--debt);justify-content:center}
.money4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

function fv(n){return Math.round(n||0)+' francs';}

function sayChange(s){const t=['Total : '+fv(s.total)+'.'];

  else if(s.change>0){t.push('Reçu : '+fv(s.given)+'.');t.push('Monnaie à rendre : '+fv(s.change)+'.');}
  else t.push('Montant exact.');
  speak(t.join(' '));}

// ===== Abonnement =====
function effToday(){const t=todayISO();if(!S)return t;const m=S.lic.maxSeen||t;const e=t>m?t:m;if(e!==S.lic.maxSeen){S.lic.maxSeen=e;save();}return e;}
function licEnd(){const a=S.lic.trialEnd||'',b=S.lic.exp||'';return a>b?a:b;}
function licState(){const t=effToday(),end=licEnd(),left=diffDays(t,end);const trial=!S.lic.exp||S.lic.trialEnd>=S.lic.exp;
  if(left>=0)return{st:left<=5?'warn':'ok',left,end,trial};if(-left<=GRACE_DAYS)return{st:'grace',left,end,trial};return{st:'blocked',left,end,trial};}
const canWrite=()=>licState().st!=='blocked';
function w(){if(canWrite())return true;toast('Abonnement terminé : payez l\'abonnement dans Plus › Réglages');return false;}
async function ensureAb(){if(!SB||!USER)return;try{const r=await SB.from('boutique_abonnements').select('user_id').eq('user_id',USER.id).maybeSingle();
  if(!r.error&&!r.data)await SB.from('boutique_abonnements').insert({user_id:USER.id,phone:USER.email.split('@')[0],trial_end:addDays(todayISO(),TRIAL_DAYS)});}catch(e){}}
async function fetchLic(){if(!SB||!USER)return false;await ensureAb();if(!S)return false;
  let r=await SB.from('boutique_abonnements').select('trial_end,paid_until').eq('user_id',USER.id).maybeSingle();
  if(r.error)throw r.error;
  if(!r.data){await SB.from('boutique_abonnements').insert({user_id:USER.id,phone:USER.email.split('@')[0],trial_end:addDays(todayISO(),TRIAL_DAYS)});
    r=await SB.from('boutique_abonnements').select('trial_end,paid_until').eq('user_id',USER.id).maybeSingle();if(r.error)throw r.error;if(!r.data)return false;}
  const te=r.data.trial_end||'',pu=r.data.paid_until||'';
  if(S.lic.trialEnd===te&&(S.lic.exp||'')===pu&&S.lic.srv)return false;
  S.lic.trialEnd=te;S.lic.exp=pu;S.lic.srv=1;writeLocal();return true;}

const client=id=>S.clients.find(c=>c.id===id);
const supplier=id=>S.suppliers.find(c=>c.id===id);
function balance(cid){const c=client(cid);let b=c&&c.opening||0;S.sales.forEach(s=>{if(s.clientId===cid)b+=s.total-s.paid});S.payments.forEach(p=>{if(p.clientId===cid)b-=p.amount});return b;}
function supBalance(sid){const s=supplier(sid);let b=s&&s.opening||0;S.purchases.forEach(p=>{if(p.supplierId===sid)b+=p.total-p.paid});S.supPayments.forEach(p=>{if(p.supplierId===sid)b-=p.amount});return b;}
const EXP_SOON=15;
function expState(p){if(!p||!p.exp)return '';const d=diffDays(effToday(),p.exp);return d<0?'out':d<=EXP_SOON?'soon':'';}
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const IS_APP=(()=>{try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}})();
function bkAge(){return diffDays(S.lastBk||S.lic.install||todayISO(),effToday());}

function findOrCreateClient(name,phone){name=name.trim();if(!name)return null;

  if(!c){c={id:uid(),name,phone:(phone||'').trim(),due:'',opening:0};S.clients.push(c);}else if(phone&&phone.trim())c.phone=phone.trim();return c;}

function docText(kind,s){const L=[];L.push('*'+S.shop.name.toUpperCase()+'*');if(S.shop.address)L.push(S.shop.address);if(S.shop.phone)L.push('Tél : '+S.shop.phone);L.push('');
  L.push((kind==='q'?'DEVIS / PROFORMA N° ':'FACTURE N° ')+no4(s.no)+' — '+fdate(s.date)+(kind==='q'?'':' '+s.date.slice(11,16)));
  if(s.client)L.push('Client : '+s.client);L.push('------------------------------');
  s.lines.forEach(l=>L.push(q2(l.qty)+' '+(l.unit&&l.unit!=='pièce'?l.unit+' ':'× ')+l.name+'  '+F(l.qty*l.price)));
  L.push('------------------------------');L.push('TOTAL : '+F(s.total));
  if(kind==='q'){L.push('');L.push('Devis valable 7 jours. Prix susceptibles de changer après.');}
  else{if(s.change>0){L.push('Reçu ('+s.mode+') : '+F(s.given));L.push('Rendu : '+F(s.change));}else L.push('Payé ('+s.mode+') : '+F(s.paid));if(s.total-s.paid>0){L.push('RESTE À PAYER : '+F(s.total-s.paid));if(s.due)L.push('À payer avant le : '+fdate(s.due));}}
  L.push('');L.push(S.shop.footer||'Merci pour votre confiance !');return L.join('\n');}

function addProdToDraft(p){const ex=draft.lines.find(l=>l.pid===p.id);const want=(ex?ex.qty:0)+1;

  if(ex)ex.qty=q2(ex.qty+1);else draft.lines.push({pid:p.id,name:p.name,unit:p.unit,qty:1,price:priceOf(p)});

function readDraft(){if(!draft)return;const m={dClient:'client',dPhone:'phone',dPaid:'paid',dDue:'due',fName:'fName',fQty:'fQty',fPrice:'fPrice',pSearch:'q'};
  Object.keys(m).forEach(k=>{const e=$(k);if(e)draft[m[k]]=e.value;});
  document.querySelectorAll('.li-qty').forEach(e=>{const l=draft.lines[+e.dataset.i];if(l)l.qty=num(e.value);});
  document.querySelectorAll('.li-price').forEach(e=>{const l=draft.lines[+e.dataset.i];if(l)l.price=num(e.value);});}

  return{total,given,paid:Math.min(Math.max(0,given),total),change:Math.max(0,given-total),missing:Math.max(0,total-given)};}
function changeHTML(){if(!draft||!draft.lines.length)return '';const c=calc();
  if(c.change>0)return '<div class="banner" style="background:var(--accent-soft);color:var(--accent)"><span>Rendre au client</span><b style="font-family:var(--display);font-size:30px">'+F(c.change)+'</b><span class="small" style="color:inherit">Reçu '+F(c.given)+' pour '+F(c.total)+'</span></div>';
  if(c.missing>0)return '<div class="banner warn"><span>Il manque</span><b style="font-family:var(--display);font-size:30px">'+F(c.missing)+'</b><span class="small" style="color:inherit">'+(c.given>0?'Reçu '+F(c.given)+'. ':'')+'Le reste ira en crédit : ouvrez « Crédit ou client connu » et écrivez son nom.</span></div>';

// ===== Mise en page ticket 58 mm : 32 caractères par ligne =====
const W58=32;
function wrapW(s,w){const out=[];let cur='';for(let word of String(s).split(' ')){if(!word)continue;
  while(word.length>w){if(cur){out.push(cur);cur='';}out.push(word.slice(0,w));word=word.slice(w);}
  if(!cur)cur=word;else if(cur.length+1+word.length<=w)cur+=' '+word;else{out.push(cur);cur=word;}}
  out.push(cur);return out;}
function lr58(l,r){const ind=(l.match(/^ */)||[''])[0];const ls=wrapW(l.trim(),W58-ind.length).map(x=>ind+x);const last=ls[ls.length-1];
  if(last.length+1+r.length<=W58)ls[ls.length-1]=last+' '.repeat(W58-last.length-r.length)+r;
  else ls.push(' '.repeat(Math.max(0,W58-r.length))+r);return ls;}
function fmt58(txt){const out=[];
  plain(txt).replace(/[\u00a0\u202f]/g,' ').split('\n').forEach(raw=>{const s=raw.replace(/\s+$/,'');let m;
    if(/^-{5,}$/.test(s)){out.push('-'.repeat(W58));return;}
    if((m=s.match(/^(\S.*?) {2,}(\S.* F)$/))){out.push(...lr58(m[1],m[2]));return;}
    if((m=s.match(/^( *\S.*?) : (\S.* F)$/))){out.push(...lr58(m[1]+' :',m[2]));return;}
    if(s.length>W58&&(m=s.match(/^(.*N° \d+) [—-] (.+)$/))){out.push(m[1],m[2]);return;}
    const ind=(s.match(/^ */)||[''])[0];if(s.length<=W58){out.push(s);return;}
    wrapW(s.trim(),W58-ind.length).forEach(x=>out.push(ind+x));});
  return out.join('\n');}

let CLC='';
function clotureText(){const t=effToday();const inD=d=>d.slice(0,10)===t;
  const sales=S.sales.filter(x=>inD(x.date)),pays=S.payments.filter(x=>inD(x.date)),exps=S.expenses.filter(x=>inD(x.date));
  const ventes=sales.reduce((a,x)=>a+x.total,0),credit=sales.reduce((a,x)=>a+x.total-x.paid,0),recup=pays.reduce((a,x)=>a+x.amount,0);
  const byMode={};MODES.forEach(m=>byMode[m]=0);sales.forEach(x=>{if(x.paid>0)byMode[MODES.includes(x.mode)?x.mode:'Espèces']+=x.paid;});pays.forEach(x=>byMode[x.mode]=(byMode[x.mode]||0)+x.amount);
  const recu=Object.values(byMode).reduce((a,b)=>a+b,0),dep=exps.reduce((a,x)=>a+x.amount,0);
  const cashOut=exps.filter(e=>e.mode==='Espèces').reduce((a,e)=>a+e.amount,0)+S.purchases.filter(x=>inD(x.date)&&x.mode==='Espèces').reduce((a,x)=>a+x.paid,0)+S.supPayments.filter(x=>inD(x.date)&&x.mode==='Espèces').reduce((a,x)=>a+x.amount,0);
  const cash=byMode['Espèces']-cashOut;let marge=0;const top={};
  sales.forEach(x=>x.lines.forEach(l=>{if(l.cost>0)marge+=(l.price-l.cost)*l.qty;const k=l.name+(l.name==='Divers'?' '+l.price+' F':'');top[k]=top[k]||{q:0,a:0};top[k].q+=l.qty;top[k].a+=l.qty*l.price;}));
  const d=new Date(),L=[];L.push('*CLÔTURE DE CAISSE*');L.push('*'+S.shop.name.toUpperCase()+'*');L.push(fdate(t)+' à '+pad(d.getHours())+':'+pad(d.getMinutes()));
  L.push('------------------------------');L.push('Factures : '+sales.length);L.push('*VENTES : '+F(ventes)+'*');if(credit>0)L.push('  dont donné à crédit : '+F(credit));
  L.push('');L.push('ARGENT REÇU');MODES.forEach(m=>L.push('  '+m+' : '+F(byMode[m])));if(recup>0)L.push('  (dont crédits récupérés : '+F(recup)+')');L.push('*TOTAL REÇU : '+F(recu)+'*');
  L.push('');L.push('Dépenses : '+F(dep));
  L.push('------------------------------');L.push('CAISSE (espèces)');L.push('  Doit être dans la caisse : '+F(cash));
  const cnt=String(CLC).trim();if(cnt!==''){const c=num(cnt),df=c-cash;L.push('  Compté : '+F(c));L.push(df===0?'  ✓ La caisse est juste':df<0?'  *MANQUE : '+F(-df)+'*':'  En plus : '+F(df));}
  if(!S.pin||unlocked){L.push('------------------------------');L.push('Bénéfice sur ventes : '+F(marge));L.push('Bénéfice − dépenses : '+F(marge-dep));}
  const tl=Object.entries(top).sort((a,b)=>b[1].a-a[1].a);if(tl.length){L.push('------------------------------');L.push('ARTICLES VENDUS');tl.forEach(([n,v])=>L.push(q2(v.q)+' × '+n+'  '+F(v.a)));}
  return L.join('\n');}

const CX_COL=['#2E9E48','#1F3FBF','#8E44D9','#D35400','#B7950B','#C0392B','#16A085','#7F8C8D'];
function cxCol(p){let h=0;for(const ch of String(p.id))h=(h*31+ch.charCodeAt(0))>>>0;return CX_COL[h%CX_COL.length];}
function cxHint(){const d=draft;if(CX.qty)return 'Quantité '+q2(CX.qty)+' × … touchez un article';if(d&&d.mode!=='Crédit'&&String(d.paid).trim()!=='')return 'Le client donne '+F(num(d.paid));return 'Tapez un nombre';}
function cxChg(){if(!draft||!draft.lines.length)return '';const c=calc();
  if(draft.mode==='Crédit'&&c.paid===0)return '<span style="color:#8E4A6B">Crédit'+(draft.client?' · '+esc(draft.client):'')+'</span>';
  if(c.change>0)return '<span style="color:var(--accent)">Reçu '+F(c.given)+'<br>Rendre '+F(c.change)+'</span>';
  if(c.missing>0&&c.given>0)return '<span style="color:var(--debt)">Reçu '+F(c.given)+'<br>Manque '+F(c.missing)+'</span>';
  return '<span style="color:var(--muted)">Montant exact</span>';}
function vCaisse(){if(!draft)draft=newDraft();const d=draft;const c=calc();const favs=S.products.filter(p=>p.fav);
  if(!CX.panel)CX.panel=favs.length?'fav':'pad';d.showAll=CX.panel==='stock';
  const inC=id=>d.lines.filter(l=>l.pid===id).reduce((a,l)=>a+l.qty,0);
  const nb=d.lines.reduce((a,l)=>a+l.qty,0);
  const lines=d.lines.map((l,i)=>{const p=l.pid&&prod(l.pid);return '<div class="cx-l"><div class="n">'+esc(l.name)+'<small>'+F(l.price)+(p?' · stock '+q2(p.qty):l.pid?'':' · hors stock')+'</small></div>'+
    '<div class="cx-st"><button data-act="qm" data-i="'+i+'" aria-label="Moins">−</button><b>'+q2(l.qty)+'</b><button data-act="qp" data-i="'+i+'" aria-label="Plus">+</button></div>'+
    '<span class="a">'+F(l.qty*l.price)+'</span><button class="cx-x" data-act="delLine" data-i="'+i+'" aria-label="Retirer">✕</button></div>';}).join('');
  const keys=['7','8','9','C','4','5','6','X','1','2','3','R','0','00',',','L'],kl={X:'× Qté',R:'Reçu',L:'Prix libre'};
  let panel='';
  if(CX.panel==='pad')panel='<div class="cx-screen"><span id="cxHint">'+esc(cxHint())+'</span><b id="cxBuf" data-notr>'+esc(CX.buf||'0')+'</b></div><div class="cx-keys">'+
    keys.map(k=>'<button type="button" class="cx-k'+(k==='C'?' c':/[XRL]/.test(k)?' op':'')+'" data-ck="key" data-k="'+k+'">'+(kl[k]||k)+'</button>').join('')+'</div>';
  else if(CX.panel==='fav')panel=favs.length?'<div class="cx-favs">'+favs.map(p=>{const left=q2(p.qty-inC(p.id));return '<button type="button" class="cx-p'+(left<=0?' fini':'')+'" style="background:'+cxCol(p)+'" data-ck="prod" data-id="'+p.id+'"><span class="st">'+(left<=0?'Fini':left)+'</span><span class="nm">'+esc(p.name)+'</span><em>'+F(priceOf(p))+'</em></button>';}).join('')+'</div>'
    :'<div class="cx-note">Pas encore de gros boutons. Dans Stock, ouvrez un article › Plus de détails › cochez « Mettre un bouton dans Vente rapide ». En attendant, utilisez « Stock » ou le scanner.</div>';
  else panel='<input id="pSearch" type="search" placeholder="Chercher un article" value="'+esc(d.q)+'" autocomplete="off"><div class="results all" id="pResults"></div>';
  const sw=[['pad','Pavé'],['fav','Boutons'],['stock','Stock']];
  const pays=[['Espèces','#2E8B57'],['Wave','#1DA1F2'],['Orange Money','#FF7900']];
  return '<div class="cx" id="cxRoot"><div class="cx-left">'+
  '<div class="cx-tk card"><div class="cx-tkh">'+(CX.qty?'<span class="q">'+q2(CX.qty)+' × … touchez un article</span>':'<span>Panier'+(nb?' · '+q2(nb)+' article(s)':'')+'</span>')+
    '<span style="display:flex;gap:6px;flex:0 0 auto"><button class="cx-chip" data-ck="client">'+(d.client?'👤 '+esc(d.client.length>14?d.client.slice(0,13)+'…':d.client):'+ Client')+'</button>'+(d.lines.length?'<button class="cx-chip" data-act="clearDraft">Vider</button>':'')+'</span></div>'+
    '<div class="cx-lines" id="cxLines">'+(lines||'<div class="cx-empty">Touchez un article, scannez ou tapez un prix.</div>')+'</div>'+
    '<div class="cx-foot"><div style="display:flex;align-items:baseline;gap:8px"><span class="small">TOTAL</span><span class="t" id="saleTotal">'+F(c.total)+'</span></div><div class="cx-chg" id="cxChg">'+cxChg()+'</div></div></div>'+
  '<div class="cx-pays">'+pays.map(([m,col])=>'<button type="button" class="cx-m" style="background:'+col+'" data-act="mode" data-m="'+m+'" aria-pressed="'+(d.mode===m)+'">'+m+'</button>').join('')+
    '<button type="button" class="cx-m" style="background:#8E4A6B" data-ck="credit" aria-pressed="'+(d.mode==='Crédit')+'">Crédit</button></div>'+
  '<button class="btn enc cx-enc" id="encBtn" data-act="saveSale"'+(d.lines.length?'':' disabled')+'>'+encLabel()+'</button></div>'+
  '<div class="cx-right"><div class="cx-sw">'+sw.map(([k,l])=>'<button type="button" class="segb" data-ck="panel" data-p="'+k+'" aria-pressed="'+(CX.panel===k)+'">'+l+'</button>').join('')+
    '<button type="button" class="segb" data-act="scanSell">'+svg('scan')+'Scan</button></div>'+
  '<div class="cx-panel" id="cxPanel">'+panel+'</div></div></div>';}
function cxAdd(p,q){if(q===1)return addProdToDraft(p);
  const ex=draft.lines.find(l=>l.pid===p.id);const want=q2((ex?ex.qty:0)+q);
  if(want>p.qty){toast(p.qty>0?'Il reste seulement '+q2(p.qty)+' '+p.unit+' de '+p.name:'Stock fini : '+p.name+'. Ajoutez du stock (+ Stock)');try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}return false;}
  if(ex)ex.qty=want;else draft.lines.push({pid:p.id,name:p.name,unit:p.unit,qty:q2(q),price:priceOf(p)});
  if(expState(p)==='out')toast('Attention : '+p.name+' est périmé');return true;}
function cxClient(){if(!draft)draft=newDraft();const d=draft;
  openSheet(d.mode==='Crédit'?'Vente à crédit':'Client','<div class="card stack">'+(d.mode==='Crédit'?'<div class="small">Le client paie plus tard. Le montant va dans ses crédits.</div>':'')+
  '<label class="f">Nom du client<input id="dClient" list="clientsDL" value="'+esc(d.client)+'" placeholder="Obligatoire si crédit"></label><label class="f">Téléphone<input id="dPhone" inputmode="tel" value="'+esc(d.phone)+'" placeholder="77…"></label>'+
  '<datalist id="clientsDL">'+S.clients.map(x=>'<option value="'+esc(x.name)+'">').join('')+'</datalist>'+
  '<label class="f">Il paiera le<input id="dDue" type="date" value="'+esc(d.due)+'"></label>'+
  '<button class="btn" data-ck="cliOk">Valider</button><button class="btn line" data-act="saveQuote"'+(d.lines.length?'':' disabled')+'>Faire un devis (proforma)</button></div>');}
// Après chaque affichage : la caisse remplit l'écran, la page ne défile plus
const _renderCx=render;
render=function(){const ln=$('cxLines'),fv=document.querySelector('.cx-favs'),rs=$('pResults');
  const keep={l:ln?ln.scrollTop:0,f:fv?fv.scrollTop:0,r:rs?rs.scrollTop:0};
  _renderCx();cxFit(keep);};
function cxFit(keep){const root=$('cxRoot');const on=!!root;document.documentElement.classList.toggle('cx-lock',on);
  if(!on){CX.n=-1;return;}
  window.scrollTo(0,0);const nav=document.querySelector('nav.tabs');const nh=nav?nav.getBoundingClientRect().height:0;
  const h=Math.floor(window.innerHeight-root.getBoundingClientRect().top-nh-6);
  if(h<200){document.documentElement.classList.remove('cx-lock');root.style.height='';}else root.style.height=h+'px';
  keep=keep||{};const ln=$('cxLines'),fv=document.querySelector('.cx-favs'),rs=$('pResults');
  const n=draft?draft.lines.length:0;
  if(ln){if(n>CX.n&&CX.n>=0)ln.scrollTop=ln.scrollHeight;else ln.scrollTop=keep.l||0;}
  if(fv)fv.scrollTop=keep.f||0;if(rs)rs.scrollTop=keep.r||0;CX.n=n;}
window.addEventListener('resize',()=>{if($('cxRoot'))cxFit({l:($('cxLines')||{}).scrollTop});});
document.addEventListener('click',e=>{const el=e.target.closest('[data-ck]');if(!el||!S)return;const a=el.dataset.ck;
  if(a==='setMode'){S.sellMode=el.dataset.m==='caisse'?'caisse':'';save();render();toast(S.sellMode?'Mode caisse activé':'Écran normal activé');return;}
  if(a==='cxTry'||a==='cxNo')return;
  if(!draft)draft=newDraft();readDraft();
  if(a==='panel'){CX.panel=el.dataset.p;draft.q='';render();return;}
  if(a==='client'){cxClient();return;}
  if(a==='credit'){draft.mode='Crédit';draft.paid='0';render();cxClient();return;}
  if(a==='cliOk'){if(draft.mode==='Crédit'&&!draft.client.trim())return toast('Écrivez le nom du client pour le crédit');closeSheet();render();return;}
  if(a==='prod'){const p=prod(el.dataset.id);if(!p)return;if(cxAdd(p,CX.qty||1))CX.qty=0;render();return;}
  if(a!=='key')return;const k=el.dataset.k;
  if(/^\d+$/.test(k)){if(CX.buf.replace(',','').length<9)CX.buf=(CX.buf+k).replace(/^0+(?=\d)/,'');}
  else if(k===','){if(!CX.buf.includes(','))CX.buf=(CX.buf||'0')+',';}
  else if(k==='C'){if(CX.buf)CX.buf='';else{CX.qty=0;if(draft.mode!=='Crédit')draft.paid='';render();return;}}
  else if(k==='X'){if(num(CX.buf)>0){CX.qty=num(CX.buf);CX.buf='';if(S.products.some(p=>p.fav))CX.panel='fav';render();return;}return toast('Tapez d\'abord la quantité (ex. 3 ou 1,5)');}
  else if(k==='R'){if(num(CX.buf)>0){draft.paid=String(Math.round(num(CX.buf)));if(draft.mode==='Crédit')draft.mode='Espèces';CX.buf='';render();return;}return toast('Tapez l\'argent que le client donne');}
  else if(k==='L'){const v=Math.round(num(CX.buf));if(v>0){const q=CX.qty||1;draft.lines.push({pid:null,name:'Divers',unit:'pièce',qty:q2(q),price:v});CX.buf='';CX.qty=0;render();toast('+ '+F(v*q));return;}return toast('Tapez le prix, puis Prix libre');}
  const b=$('cxBuf');if(b)b.textContent=CX.buf||'0';const h=$('cxHint');if(h)h.textContent=cxHint();});
// Encaisser à crédit sans nom : on ouvre la fiche client au lieu de faire défiler
document.addEventListener('click',e=>{const b=e.target.closest('#encBtn');if(!b||!$('cxRoot')||!draft)return;readDraft();const c=calc();
  if(c.paid<c.total&&!String(draft.client||'').trim()){e.stopImmediatePropagation();e.preventDefault();cxClient();toast('Écrivez le nom du client pour le crédit');}},true);
// Lecteur de code-barres (POS Android, USB, Bluetooth) : il tape le code puis Entrée
let cxKb='',cxKt=0;
document.addEventListener('keydown',e=>{if(!S||tab!=='sell'||S.sellMode!=='caisse')return;const t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;if($('sheetRoot').innerHTML.trim())return;
  const n=Date.now();if(n-cxKt>150)cxKb='';cxKt=n;
  if(e.key==='Enter'){const c=cxKb.trim();cxKb='';if(c.length<4)return;e.preventDefault();if(!w())return;if(!draft)draft=newDraft();readDraft();const p=byCode(c);
    if(p){try{beep()}catch(x){}const ok=addProdToDraft(p);render();if(ok)toast('+1 '+p.name);}
    else openSheet('Article inconnu','<div class="card stack"><div>Le code <b>'+esc(c)+'</b> n\'est pas dans votre stock.</div><button class="btn" data-act="createFromCode" data-c="'+esc(c)+'">Créer l\'article</button><button class="btn line" data-act="close">Annuler</button></div>');}
  else if(e.key.length===1)cxKb+=e.key;});
