  if(left>=0)return{st:left<=5?'warn':'ok',left,end,trial};if(-left<=GRACE_DAYS)return{st:'grace',left,end,trial};return{st:'blocked',left,end,trial};}
const canWrite=()=>licState().st!=='blocked';
function w(){if(canWrite())return true;toast('Abonnement terminé : payez l\'abonnement dans Plus › Réglages');return false;}
async function ensureAb(){if(!SB||!USER)return;try{const r=await SB.from('boutique_abonnements').select('user_id').eq('user_id',USER.id).maybeSingle();
  if(!r.error&&!r.data)await SB.from('boutique_abonnements').insert({user_id:USER.id,phone:USER.email.split('@')[0],trial_end:addDays(todayISO(),TRIAL_DAYS)});}catch(e){}}
async function fetchLic(){if(!SB||!USER)return false;await ensureAb();if(!S)return false;
  let r=await SB.from('boutique_abonnements').select('trial_end,paid_until').eq('user_id',USER.id).maybeSingle();
  if(r.error)throw r.error;
  if(!r.data){await SB.from('boutique_abonnements').insert({user_id:USER.id,phone:USER.email.split('@')[0],trial_end:addDays(todayISO(),TRIAL_DAYS)});
    r=await SB.from('boutique_abonnements').select('trial_end,paid_until').eq('user_id',USER.id).maybeSingle();if(r.error)throw r.error;if(!r.data)return false;}
  const te=r.data.trial_end||'',pu=r.data.paid_until||'';
  if(S.lic.trialEnd===te&&(S.lic.exp||'')===pu&&S.lic.srv)return false;
  S.lic.trialEnd=te;S.lic.exp=pu;S.lic.srv=1;writeLocal();return true;}

// ===== Calculs =====
const prod=id=>S.products.find(p=>p.id===id);
const client=id=>S.clients.find(c=>c.id===id);
const supplier=id=>S.suppliers.find(c=>c.id===id);
function balance(cid){const c=client(cid);let b=c&&c.opening||0;S.sales.forEach(s=>{if(s.clientId===cid)b+=s.total-s.paid});S.payments.forEach(p=>{if(p.clientId===cid)b-=p.amount});return b;}
function supBalance(sid){const s=supplier(sid);let b=s&&s.opening||0;S.purchases.forEach(p=>{if(p.supplierId===sid)b+=p.total-p.paid});S.supPayments.forEach(p=>{if(p.supplierId===sid)b-=p.amount});return b;}
const EXP_SOON=15;
function expState(p){if(!p||!p.exp)return '';const d=diffDays(effToday(),p.exp);return d<0?'out':d<=EXP_SOON?'soon':'';}
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const IS_APP=(()=>{try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}})();
function bkAge(){return diffDays(S.lastBk||S.lic.install||todayISO(),effToday());}
function markBk(){S.lastBk=effToday();S.bkSnooze='';save();}
async function sendBackup(){const txt=JSON.stringify(S);const name='carnet-boutique-'+todayISO()+'.json';
  try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Sauvegarde Carnet Boutique'});markBk();render();toast('Sauvegarde envoyée');return;}}catch(e){if(e&&e.name==='AbortError')return;}
  copyText(txt);markBk();render();toast('Sauvegarde copiée : collez-la dans WhatsApp');}
function a2hsCard(onb){if(IS_APP)return '';if(!onb&&S&&S.a2hs)return '';

  return '<div class="banner warn" style="margin-top:14px"><b>'+(onb?'Avant de commencer : mettez l\'app sur l\'écran d\'accueil':'Mettez l\'app sur l\'écran d\'accueil')+'</b>'+steps+
  (IS_IOS&&!USER?'<span class="small" style="color:inherit">Sur iPhone, c\'est important : sinon les données peuvent être effacées. Les données de Safari ne passent pas dans l\'icône : si vous avez déjà commencé, faites une sauvegarde ici et restaurez-la dans l\'icône.</span>':'')+
  (onb?'':'<button class="btn sm line" data-act="a2hsDone">C\'est fait</button>')+'</div>';}
const isLate=c=>balance(c.id)>0&&c.due&&c.due<effToday();
function findOrCreateClient(name,phone){name=name.trim();if(!name)return null;
  let c=S.clients.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!c){c={id:uid(),name,phone:(phone||'').trim(),due:'',opening:0};S.clients.push(c);}else if(phone&&phone.trim())c.phone=phone.trim();return c;}
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===9&&d[0]==='7')d='221'+d;return d;}
const waLink=(phone,text)=>'https://wa.me/'+waNum(phone)+'?text='+encodeURIComponent(text);
const no4=n=>String(n).padStart(4,'0');
function docText(kind,s){const L=[];L.push('*'+S.shop.name.toUpperCase()+'*');if(S.shop.address)L.push(S.shop.address);if(S.shop.phone)L.push('Tél : '+S.shop.phone);L.push('');
  L.push((kind==='q'?'DEVIS / PROFORMA N° ':'FACTURE N° ')+no4(s.no)+' — '+fdate(s.date)+(kind==='q'?'':' '+s.date.slice(11,16)));
  if(s.client)L.push('Client : '+s.client);L.push('------------------------------');
  s.lines.forEach(l=>L.push(q2(l.qty)+' '+(l.unit&&l.unit!=='pièce'?l.unit+' ':'× ')+l.name+'  '+F(l.qty*l.price)));
  L.push('------------------------------');L.push('TOTAL : '+F(s.total));
  if(kind==='q'){L.push('');L.push('Devis valable 7 jours. Prix susceptibles de changer après.');}
  else{if(s.change>0){L.push('Reçu ('+s.mode+') : '+F(s.given));L.push('Rendu : '+F(s.change));}else L.push('Payé ('+s.mode+') : '+F(s.paid));if(s.total-s.paid>0){L.push('RESTE À PAYER : '+F(s.total-s.paid));if(s.due)L.push('À payer avant le : '+fdate(s.due));}}
  L.push('');L.push(S.shop.footer||'Merci pour votre confiance !');return L.join('\n');}

function variant(im,max,rot,crop){const sw=im.naturalWidth,sh=im.naturalHeight;let sx=0,sy=0,cw=sw,ch=sh;
  if(crop){cw=sw*0.7;ch=sh*0.5;sx=(sw-cw)/2;sy=(sh-ch)/2;}
  const k=Math.min(1,max/Math.max(cw,ch));const w=Math.round(cw*k),h=Math.round(ch*k);
  const c=document.createElement('canvas');const r=rot%180!==0;c.width=r?h:w;c.height=r?w:h;const g=c.getContext('2d');
  g.filter='grayscale(1) contrast(1.4)';g.translate(c.width/2,c.height/2);g.rotate(rot*Math.PI/180);g.drawImage(im,sx,sy,cw,ch,-w/2,-h/2,w,h);
  return new Promise(ok=>c.toBlob(b=>ok(new File([b],'v.jpg',{type:'image/jpeg'})),'image/jpeg',0.92));}

async function snap(box){await new Promise(r=>setTimeout(r,60));const W=box.offsetWidth,H=box.offsetHeight;
  const sc=Math.max(0.6,Math.min(2,Math.sqrt(14e6/(W*H))));
  const cv=await html2canvas(box,{scale:sc,backgroundColor:'#ffffff',width:W,windowWidth:W});return{cv,W,H,sc};}

async function makePdf(kind,data){toast('Préparation…');
  try{await loadLib('jspdf');await loadLib('h2c');}
  catch(e){toast('PDF impossible sans internet : connectez-vous une fois');return;}
  try{const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});let cvImg;
    if(kind==='text'){doc.setFont('courier','normal');doc.setFontSize(11);const lh=5.2,top=16,bot=284,left=14;let y=top;
      for(const raw of pdfSafe(data).split('\n')){const parts=raw===''?['']:doc.splitTextToSize(raw,182);
        for(const p of parts){if(y>bot){doc.addPage();y=top;}doc.text(p,left,y);y+=lh;}}
      const box=document.createElement('div');box.id='pdfArea';box.className='tick';box.textContent=plain(data).replace(/[  ]/g,' ');document.body.appendChild(box);
      try{cvImg=(await snap(box)).cv;}finally{box.remove();}}
    else{const box=document.createElement('div');box.id='pdfArea';box.innerHTML=data;document.body.appendChild(box);
      try{const base=box.getBoundingClientRect().top;
        const cuts=[...box.querySelectorAll('tr,h1,h2,h3,p,.kpi,.foot,.sub,table')].map(el=>Math.round(el.getBoundingClientRect().top-base)).filter(v=>v>0).sort((x,y)=>x-y);
        const {cv,W,H,sc}=await snap(box);cvImg=cv;const pageH=Math.floor(W*(277/190));let y0=0,first=true;
        while(y0<H-2){let y1=Math.min(y0+pageH,H);if(y1<H){const c=cuts.filter(v=>v>y0+pageH*0.5&&v<=y0+pageH);if(c.length)y1=c[c.length-1];}
          const pc=document.createElement('canvas');pc.width=cv.width;pc.height=Math.ceil((y1-y0)*sc);const cx=pc.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,pc.width,pc.height);
          cx.drawImage(cv,0,Math.floor(y0*sc),cv.width,pc.height,0,0,pc.width,pc.height);
          if(!first)doc.addPage();first=false;doc.addImage(pc.toDataURL('image/jpeg',0.92),'JPEG',10,10,190,(y1-y0)*190/W);y0=y1;}
      }finally{box.remove();}}
    const name=pdfName();if(PDF){PDF.url&&URL.revokeObjectURL(PDF.url);PDF.iurl&&URL.revokeObjectURL(PDF.iurl);}
    const blob=doc.output('blob');const img=await toBlob(cvImg,'image/png');
    PDF={blob,name,url:URL.createObjectURL(blob),img,iname:name.replace(/\.pdf$/,'.png'),iurl:img?URL.createObjectURL(img):''};
    openSheet('Aperçu','<div class="prev">'+(PDF.iurl?'<img src="'+PDF.iurl+'" alt="Aperçu">':'')+'</div>'+
      '<div class="small" style="margin:8px 0 10px">Vérifiez, puis choisissez comment l\'envoyer.</div><div class="stack">'+
      '<div class="grid2"><button class="btn" data-act="pdfShare">📄 Envoyer en PDF</button><button class="btn ghost" data-act="imgShare">🖼 Envoyer en image</button></div>'+
      (DL?'':'<button class="btn line" data-act="pdfPrint">🖨 Imprimer</button>')+
      '<div class="small">Le menu du téléphone s\'ouvre : choisissez WhatsApp, ou « Enregistrer dans Fichiers » / « Enregistrer l\'image ».</div></div>');}
  catch(e){toast('PDF impossible : réessayez');}}

async function btPrint(txt){if(!navigator.bluetooth)return toast('Bluetooth pas disponible sur ce téléphone');
  const SV=['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ff00-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb'];
  try{if(!BT||!BT.device.gatt.connected){const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:SV});const gatt=await dev.gatt.connect();
      let ch=null;for(const sv of await gatt.getPrimaryServices()){for(const c of await sv.getCharacteristics()){if(c.properties.write||c.properties.writeWithoutResponse){ch=c;break;}}if(ch)break;}
      if(!ch)return toast('Imprimante non reconnue');BT={device:dev,ch};}
    const data=new TextEncoder().encode('\x1B\x40'+ascii(fmt58(txt))+'\n\n\n\n');const out=new Uint8Array(data.length+3);out.set(data);out.set([0x1D,0x56,0x01],data.length);
    for(let i=0;i<out.length;i+=100){const part=out.slice(i,i+100);if(BT.ch.properties.writeWithoutResponse)await BT.ch.writeValueWithoutResponse(part);else await BT.ch.writeValue(part);}
    toast('Imprimé');}catch(e){if(e&&e.name==='NotFoundError')return;BT=null;toast('Impression Bluetooth impossible : essayez « Imprimer »');}}

// ===== Ticket 58 mm (caisse Android avec imprimante intégrée) — séparé du PDF =====
let TK='';
const isAndroid=/Android/i.test(navigator.userAgent||'');
// ===== Mise en page ticket 58 mm : 32 caractères par ligne =====
const W58=32;
function wrapW(s,w){const out=[];let cur='';for(let word of String(s).split(' ')){if(!word)continue;
  while(word.length>w){if(cur){out.push(cur);cur='';}out.push(word.slice(0,w));word=word.slice(w);}
  if(!cur)cur=word;else if(cur.length+1+word.length<=w)cur+=' '+word;else{out.push(cur);cur=word;}}
  out.push(cur);return out;}
function lr58(l,r){const ind=(l.match(/^ */)||[''])[0];const ls=wrapW(l.trim(),W58-ind.length).map(x=>ind+x);const last=ls[ls.length-1];
  if(last.length+1+r.length<=W58)ls[ls.length-1]=last+' '.repeat(W58-last.length-r.length)+r;
  else ls.push(' '.repeat(Math.max(0,W58-r.length))+r);return ls;}
function fmt58(txt){const out=[];
  plain(txt).replace(/[\u00a0\u202f]/g,' ').split('\n').forEach(raw=>{const s=raw.replace(/\s+$/,'');let m;
    if(/^-{5,}$/.test(s)){out.push('-'.repeat(W58));return;}
    if((m=s.match(/^(\S.*?) {2,}(\S.* F)$/))){out.push(...lr58(m[1],m[2]));return;}
    if((m=s.match(/^( *\S.*?) : (\S.* F)$/))){out.push(...lr58(m[1]+' :',m[2]));return;}
    if(s.length>W58&&(m=s.match(/^(.*N° \d+) [—-] (.+)$/))){out.push(m[1],m[2]);return;}
    const ind=(s.match(/^ */)||[''])[0];if(s.length<=W58){out.push(s);return;}
    wrapW(s.trim(),W58-ind.length).forEach(x=>out.push(ind+x));});
  return out.join('\n');}
function ticket58(txt){TK=fmt58(String(txt||''));
  openSheet('Ticket 58 mm','<div class="receipt" style="max-width:250px;margin:0 auto;font-size:11px;padding:10px;white-space:pre;overflow:hidden">'+esc(plain(TK))+payQrHTML('display:block;width:130px;margin:10px auto 0')+'</div><div class="stack" style="margin-top:12px">'+
  '<button class="btn" data-act="tkPrint">🖨 Imprimer le ticket</button>'+
  (isAndroid?'<button class="btn line" data-act="tkRaw">Imprimer avec l\'app RawBT</button>':'')+
  '<div class="small">Pour la caisse Android avec imprimante intégrée (rouleau 58 mm). Si « Imprimer le ticket » ne trouve pas l\'imprimante, installez l\'app gratuite RawBT (Play Store) et utilisez le 2e bouton.</div></div>');}
function tkPrint(){if(!TK)return;
  const f=document.createElement('iframe');f.setAttribute('aria-hidden','true');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  const d=f.contentWindow.document;d.open();
  d.write('<!doctype html><html><head><meta charset="utf-8"><title>Ticket</title><style>@page{size:58mm auto;margin:0}html,body{margin:0;padding:0;background:#fff;color:#000}pre{width:48mm;margin:0 auto;padding:2mm 0 8mm;white-space:pre;overflow:hidden;font:bold 7pt/1.3 ui-monospace,Menlo,Consolas,monospace}</style></head><body><pre>'+esc(plain(TK))+'</pre>'+payQrHTML('display:block;width:34mm;margin:-6mm auto 8mm')+'</body></html>');
  d.close();

function tkRaw(){if(!TK)return;
  const bytes=new TextEncoder().encode('\x1B\x40'+ascii(TK)+'\n\n\n\n'+'\x1D\x56\x01');let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));
  location.href='intent:base64,'+btoa(bin)+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';}

let CLC='';
function clotureText(){const t=effToday();const inD=d=>d.slice(0,10)===t;
  const sales=S.sales.filter(x=>inD(x.date)),pays=S.payments.filter(x=>inD(x.date)),exps=S.expenses.filter(x=>inD(x.date));
  const ventes=sales.reduce((a,x)=>a+x.total,0),credit=sales.reduce((a,x)=>a+x.total-x.paid,0),recup=pays.reduce((a,x)=>a+x.amount,0);
  const byMode={};MODES.forEach(m=>byMode[m]=0);sales.forEach(x=>{if(x.paid>0)byMode[MODES.includes(x.mode)?x.mode:'Espèces']+=x.paid;});pays.forEach(x=>byMode[x.mode]=(byMode[x.mode]||0)+x.amount);
  const recu=Object.values(byMode).reduce((a,b)=>a+b,0),dep=exps.reduce((a,x)=>a+x.amount,0);
  const cashOut=exps.filter(e=>e.mode==='Espèces').reduce((a,e)=>a+e.amount,0)+S.purchases.filter(x=>inD(x.date)&&x.mode==='Espèces').reduce((a,x)=>a+x.paid,0)+S.supPayments.filter(x=>inD(x.date)&&x.mode==='Espèces').reduce((a,x)=>a+x.amount,0);
  const cash=byMode['Espèces']-cashOut;let marge=0;const top={};
  sales.forEach(x=>x.lines.forEach(l=>{if(l.cost>0)marge+=(l.price-l.cost)*l.qty;const k=l.name+(l.name==='Divers'?' '+l.price+' F':'');top[k]=top[k]||{q:0,a:0};top[k].q+=l.qty;top[k].a+=l.qty*l.price;}));
  const d=new Date(),L=[];L.push('*CLÔTURE DE CAISSE*');L.push('*'+S.shop.name.toUpperCase()+'*');L.push(fdate(t)+' à '+pad(d.getHours())+':'+pad(d.getMinutes()));
  L.push('------------------------------');L.push('Factures : '+sales.length);L.push('*VENTES : '+F(ventes)+'*');if(credit>0)L.push('  dont donné à crédit : '+F(credit));
  L.push('');L.push('ARGENT REÇU');MODES.forEach(m=>L.push('  '+m+' : '+F(byMode[m])));if(recup>0)L.push('  (dont crédits récupérés : '+F(recup)+')');L.push('*TOTAL REÇU : '+F(recu)+'*');
  L.push('');L.push('Dépenses : '+F(dep));
  L.push('------------------------------');L.push('CAISSE (espèces)');L.push('  Doit être dans la caisse : '+F(cash));
  const cnt=String(CLC).trim();if(cnt!==''){const c=num(cnt),df=c-cash;L.push('  Compté : '+F(c));L.push(df===0?'  ✓ La caisse est juste':df<0?'  *MANQUE : '+F(-df)+'*':'  En plus : '+F(df));}
  if(!S.pin||unlocked){L.push('------------------------------');L.push('Bénéfice sur ventes : '+F(marge));L.push('Bénéfice − dépenses : '+F(marge-dep));}
  const tl=Object.entries(top).sort((a,b)=>b[1].a-a[1].a);if(tl.length){L.push('------------------------------');L.push('ARTICLES VENDUS');tl.forEach(([n,v])=>L.push(q2(v.q)+' × '+n+'  '+F(v.a)));}
  return L.join('\n');}

function kbChar(e){const m=/^(?:Digit|Numpad)(\d)$/.exec(e.code||'');if(m)return m[1];

function wvShrink(file,W,H,q,fit){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));im.onload=()=>{
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const sc=fit==='contain'?Math.min(W/im.width,H/im.height):Math.max(W/im.width,H/im.height),w2=im.width*sc,h2=im.height*sc;x.drawImage(im,(W-w2)/2,(H-h2)/2,w2,h2);
  const url=c.toDataURL('image/jpeg',q);if(c.toBlob)c.toBlob(b=>res({blob:b,url}),'image/jpeg',q);else res({blob:null,url});};im.src=r.result;};r.readAsDataURL(file);});}
function wvRm(u){if(!SB||!USER||!u)return;const mark='/object/public/seck-photos/';if(!u.includes(mark))return;
  const p=decodeURIComponent(u.split(mark)[1].split('?')[0]);if(p.startsWith(USER.id+'/'))SB.storage.from('seck-photos').remove([p]).catch(()=>{});}
async function wvUpload(file,kind){if(!w()||WV_BUSY)return;const W=webDef();W.photos=Array.isArray(W.photos)?W.photos:[];
  if(kind==='photo'&&W.photos.length>=3)return toast('3 photos maximum');
  WV_BUSY=kind;render();
  try{const logo=kind==='logo',r=await wvShrink(file,logo?320:1000,logo?320:563,logo?.85:.74,logo?'contain':'cover');let url=r.url;
    if(SB&&USER){if(!r.blob)throw new Error('blob');const path=USER.id+'/'+uid()+'.jpg';
      const up=await SB.storage.from('seck-photos').upload(path,r.blob,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false});if(up.error)throw up.error;
      url=SB.storage.from('seck-photos').getPublicUrl(path).data.publicUrl;}
    const W2=webDef();W2.photos=Array.isArray(W2.photos)?W2.photos:[];if(logo){wvRm(W2.logo);W2.logo=url;}else W2.photos.push(url);save();toast(logo?'Logo ajouté':'Photo ajoutée');}
  catch(e){const m=String(e&&e.message||'');toast(/img|blob/.test(m)?'Photo illisible, essayez une autre':/bucket|not found/i.test(m)?'Photos pas encore activées : écrivez à '+SUPPORT_NAME:/policy|security|row-level/i.test(m)?'Photo refusée':'Photo pas envoyée : vérifiez internet et réessayez');}
  finally{WV_BUSY='';render();}}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act="wvDel"],[data-act="wvFirst"]');if(!el||!S||!w())return;const W=webDef();W.photos=W.photos||[];
  if(el.dataset.act==='wvFirst'){const i=+el.dataset.i;W.photos.unshift(W.photos.splice(i,1)[0]);}
  else if(el.dataset.k==='logo'){wvRm(W.logo);W.logo='';}else{wvRm(W.photos.splice(+el.dataset.i,1)[0]);}
  save();render();});
function wpRefresh(){const b=$('wpPics');if(b)b.innerHTML=wpPicsHTML();}
function bigPhoto(blob){return new Promise((ok,ko)=>{const u=URL.createObjectURL(blob);const im=new Image();
  im.onload=()=>{const k=Math.min(1,1000/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    const tryQ=q=>c.toBlob(b=>{if(!b)return ko();if(b.size>380000&&q>0.5)return tryQ(q-0.12);ok(b);},'image/jpeg',q);tryQ(0.82);};
  im.onerror=()=>{URL.revokeObjectURL(u);ko();};im.src=u;});}
async function wpUpload(file){if(!WP)return;if(!SB||!USER)return toast('Connectez-vous à internet pour ajouter des photos');if(!w())return;
  const cur=WP;cur.busy++;wpRefresh();
  try{const b=await bigPhoto(file);const path=USER.id+'/'+uid()+'.jpg';
    const r=await SB.storage.from('boutique-photos').upload(path,b,{contentType:'image/jpeg',upsert:false});if(r.error)throw r.error;
    const url=SB.storage.from('boutique-photos').getPublicUrl(path).data.publicUrl;cur.photos.push(url);
    const p=prod(cur.id);if(p&&!p.img){try{p.img=await shrink(b,260);}catch(e){}}}
  catch(e){const m=String(e&&e.message||'');toast(/bucket|not found|policy|security|row-level/i.test(m)?'Photos pas encore activées : écrivez à '+SUPPORT_NAME:'Photo pas envoyée : vérifiez internet et réessayez');}
  finally{cur.busy--;if(WP===cur)wpRefresh();}}

function webNtfy(){if(!S.web.ntfy){const a='abcdefghijkmnpqrstuvwxyz23456789';let r='cb-';const b=new Uint32Array(16);try{crypto.getRandomValues(b);}catch(e){b.forEach((_,i)=>b[i]=Math.random()*1e9);}b.forEach(x=>r+=a[x%a.length]);S.web.ntfy=r;save();}return S.web.ntfy;}
function webCmdBtn(){if(!webOn())return '';const n=WCMD.length;
  return '<button class="chip cmdchip'+(n?' hot':'')+'" data-tab="cmd" id="cmdBtn" aria-label="Commandes en ligne : '+n+'">🛒'+(n?' '+n:'')+'</button>';}
function webCmdPaint(){const b=$('cmdBtn');if(b){b.outerHTML=webCmdBtn();}}

/* ---------- Notifications sur le téléphone (même app fermée) ---------- */
const PUSH_PUB='BLcHXOxXIRWkIBKizjrAQ0pRpNURUxUGiIlzYgHCGH-aAKLeiGsoL_thiuzOrPAUaF6lWhgOtBFTajqAcmO6sB8',PUSH_APP='boutique',PUSH_KEY='seckPush.'+PUSH_APP;let pushSynced=false,pushBusy=false;
const pushIOS=()=>/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const pushHome=()=>!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
const pushOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const pushDemo=()=>(typeof DEMO!=='undefined'&&DEMO)||!SB||!USER;
function pushB64(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
const pushFlag=()=>{try{return localStorage.getItem(PUSH_KEY)==='1'}catch(e){return false}};
async function pushReg(){let r=await navigator.serviceWorker.getRegistration();if(!r)r=await navigator.serviceWorker.register('sw.js');
  return await Promise.race([navigator.serviceWorker.ready,new Promise((_,j)=>setTimeout(()=>j(new Error('SW')),15000))])}
async function pushSub(){if(!pushOk())return null;try{const r=await navigator.serviceWorker.getRegistration();return r?await r.pushManager.getSubscription():null}catch(e){return null}}
function pushCard(){return '<div class="pushcard"><b class="pushh">🔔 Notifications des commandes en ligne</b><div class="pushnote">Recevez une notification sur ce téléphone à chaque commande de votre boutique en ligne, même quand l\'app est fermée.</div><div id="pushbox"><div class="pushnote">Un instant…</div></div></div>'}
async function fillPush(){const box=document.getElementById('pushbox');if(!box||pushBusy)return;let h='';
  if(pushDemo())h='<div class="pushnote">Disponible avec votre compte (pas en démo).</div>';
  else if(!pushOk())h='<div class="pushnote pushwarn">'+(pushIOS()&&!pushHome()?'Sur iPhone : touchez <b>Partager</b> ⬆️ puis <b>Sur l\'écran d\'accueil</b>. Ouvrez l\'app depuis l\'icône, connectez-vous, puis revenez ici.':'Ce navigateur ne reçoit pas les notifications. Sur Android, utilisez Chrome.')+'</div>';
  else if(Notification.permission==='denied')h='<div class="pushnote pushwarn">Les notifications sont bloquées. Autorisez-les dans les réglages du téléphone (Notifications), puis réessayez.</div>';
  else{const s=Notification.permission==='granted'&&pushFlag()?await pushSub():null;
    h=s?'<div class="pushon">✅ Activées sur ce téléphone</div><div class="pushrow"><button type="button" class="pushbtn ghost" id="push_test">Tester</button><button type="button" class="pushbtn ghost" id="push_off">Désactiver</button></div>'
      :'<button type="button" class="pushbtn" id="push_on">Activer les notifications</button>'}
  const b=document.getElementById('pushbox');if(!b)return;b.innerHTML=h;
  const on=document.getElementById('push_on');if(on)on.onclick=()=>pushEnable(on);
  const off=document.getElementById('push_off');if(off)off.onclick=async()=>{off.disabled=true;await pushDrop();toast('Notifications désactivées sur ce téléphone');fillPush()};
  const ts=document.getElementById('push_test');if(ts)ts.onclick=async()=>{ts.disabled=true;try{const s=await pushSub();if(!s)throw 0;
    let r=await SB.rpc('seck_push_save',{p_app:PUSH_APP,p_sub:s.toJSON()});if(r.error)throw r.error;r=await SB.rpc('seck_push_test',{p_app:PUSH_APP});if(r.error)throw r.error;toast('Test envoyé : la notification arrive dans quelques secondes')}catch(e){toast('Pas de connexion, réessayez')}ts.disabled=false}}
async function pushEnable(btn){if(pushDemo())return;btn.disabled=true;pushBusy=true;
  try{const perm=await Notification.requestPermission();if(perm!=='granted'){toast('Notifications refusées');throw 0}
    const reg=await pushReg();let s=await reg.pushManager.getSubscription();
    if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushB64(PUSH_PUB)});
    const r=await SB.rpc('seck_push_save',{p_app:PUSH_APP,p_sub:s.toJSON()});if(r.error)throw r.error;
    try{localStorage.setItem(PUSH_KEY,'1')}catch(e){}pushSynced=true;toast('Notifications activées ✅')}
  catch(e){if(e)toast('Impossible d\'activer les notifications. Réessayez.')}
  pushBusy=false;fillPush()}
async function pushDrop(){const s=await pushSub();try{localStorage.removeItem(PUSH_KEY)}catch(e){}pushSynced=false;if(!s)return;
  try{if(SB&&USER)await SB.rpc('seck_push_drop',{p_endpoint:s.endpoint})}catch(e){}try{await s.unsubscribe()}catch(e){}}
async function pushResync(){if(pushSynced||pushDemo()||!pushFlag()||!pushOk()||Notification.permission!=='granted')return;pushSynced=true;
  try{const s=await pushSub();if(s){const r=await SB.rpc('seck_push_save',{p_app:PUSH_APP,p_sub:s.toJSON()});if(r.error)pushSynced=false}}catch(e){pushSynced=false}}

/* ======================================================================
   MODE BOUTIQUE DE MODE ET TISSUS (activé dans Réglages ; sinon rien ne change)
   - Tailles + couleurs (vêtements, chaussures…) ou qualités + couleurs (tissus),
     avec le stock de chaque taille / couleur.
   - Commandes à livrer : zones avec prix, payé avant ou à la livraison, acompte,
     statuts (à préparer → en route → livrée), échange de taille.
   Vente au carton / pièce entière : pour tous les articles qui ont un prix de
   vente du carton (ou de la pièce de tissu).
   ====================================================================== */
const fashOn=()=>{const t=S&&S.btype;return ['mode','cosm','art','phar'].includes(t)||!!(S&&(!t||t==='tout')&&S.fash&&S.fash.on);};
const hasVar=p=>!!(p&&Array.isArray(p.var)&&p.var.length);
const isSoft=u=>['m','kg','litre','m²'].includes(u);
const canPk=p=>!!(p&&p.pack>0&&p.pricePk>0);
const pkName=p=>isSoft(p.unit)?'pièce de '+q2(p.pack)+' '+p.unit:'carton de '+q2(p.pack);
const clean=s=>String(s||'').replace(/[|<>]/g,'').trim().slice(0,24);
const uniqA=a=>[...new Set(a)];
function fashDef(){S.fash=Object.assign({on:false,zones:[{n:'Même quartier',p:500},{n:'Dakar',p:1500},{n:'Banlieue',p:2000},{n:'Régions',p:3500}]},S.fash||{});
  if(!Array.isArray(S.fash.zones))S.fash.zones=[];if(!Array.isArray(S.livs))S.livs=[];return S.fash;}
const vFind=(p,t,c)=>hasVar(p)?p.var.find(v=>v.t===String(t==null?'':t)&&v.c===String(c==null?'':c)):null;
const vLab=(t,c)=>[t&&t!=='Unique'?t:'',c].filter(Boolean).join(' · ');
function varSync(p){if(hasVar(p))p.qty=q2(p.var.reduce((a,v)=>a+(+v.q||0),0));}
function vSum(p){const out=p.var.filter(v=>!(v.q>0)).length;return (p.vk==='qualite'?'qualités/couleurs : ':'tailles/couleurs : ')+p.var.length+(out?' ('+out+' fini'+(out>1?'es':'e')+')':'');}
const COLS={noir:'#111',blanc:'#fff',rouge:'#D32F2F',bleu:'#1E5BC6',vert:'#2E7D32',jaune:'#F5C518',rose:'#F48FB1',beige:'#D9C2A0',marron:'#7B4A2A',gris:'#9E9E9E','doré':'#D4AF37',dore:'#D4AF37',argent:'#C0C0C0',bordeaux:'#7B1E2E',orange:'#F57C00',violet:'#7B3FA0',kaki:'#7C7B4A',crème:'#F3E9D2',creme:'#F3E9D2',turquoise:'#1BB1B1',saumon:'#F4A081',mauve:'#B784A7',bleu_ciel:'#87C6EE'};
function cdot(c){const k=String(c||'').toLowerCase().trim();const h=COLS[k.replace(/\s+/g,'_')]||COLS[k.split(/\s+/)[0]];return h?'<span class="vdot" style="background:'+h+'"></span>':'';}

/* ---------- Lignes de vente : stock par taille/couleur et au carton ---------- */
const lnPk=l=>l.pk>0?l.pk:1;
const lnHasV=l=>l.vt!=null;
function lnSame(a,b){return a.pid===b.pid&&(!hasVar(prod(a.pid))||(a.vt===b.vt&&a.vc===b.vc));}
function lnAvail(l){const p=l.pid&&prod(l.pid);if(!p||isArt())return Infinity;if(hasVar(p)&&lnHasV(l)){const v=vFind(p,l.vt,l.vc);return v?v.q:0;}return p.qty;}
function lnUsed(l,lines){return q2(lines.filter(x=>x.pid&&lnSame(x,l)).reduce((a,x)=>a+x.qty*lnPk(x),0));}
function overLines(lines){return lines.filter(l=>l.pid&&prod(l.pid)&&lnUsed(l,lines)>lnAvail(l)+1e-9);}
function fitLines(lines){const used={};lines.forEach(l=>{const p=l.pid&&prod(l.pid);if(!p)return;const k=l.pid+'|'+(hasVar(p)&&lnHasV(l)?l.vt+'|'+l.vc:'');
  const left=Math.max(0,lnAvail(l)-(used[k]||0));let can=q2(left/lnPk(l));if(l.pk)can=Math.floor(can);if(l.qty>can)l.qty=can;used[k]=(used[k]||0)+l.qty*lnPk(l);});}
function lnMove(l,sign){const p=l.pid&&prod(l.pid);if(!p||isArt())return;let n=q2(l.qty*lnPk(l));
  if(!hasVar(p)){p.qty=q2(p.qty+sign*n);return;}
  const v=lnHasV(l)?vFind(p,l.vt,l.vc):null;
  if(v)v.q=q2(v.q+sign*n);
  else if(sign>0)p.var[0].q=q2(p.var[0].q+n);
  else{for(const x of p.var){const d=Math.min(Math.max(0,x.q),n);x.q=q2(x.q-d);n=q2(n-d);if(n<=0)break;}if(n>0)p.var[0].q=q2(p.var[0].q-n);}
  varSync(p);}
function lnCopy(l){const o={pid:l.pid,name:l.name,unit:l.unit,qty:l.qty,price:l.price,cost:l.cost||0};if(lnHasV(l)){o.vt=l.vt;o.vc=l.vc||'';}if(l.pk>0)o.pk=l.pk;return o;}
const lnKey=l=>(l.pid||'')+'#'+(lnHasV(l)?l.vt+'|'+l.vc:'')+'#'+(l.pk||0);
function lnName(p,l){const lb=[vLab(l.vt,l.vc),l.pk?pkName(p):''].filter(Boolean).join(', ');return p.name+(lb?' ('+lb+')':'');}
function addLine(p,o){if(!p)return false;
  if(hasVar(p)&&o.vt==null){varPick(p,o);return false;}
  const pk=o.pk>0?o.pk:0,n=o.n>0?o.n:1;
  const nl={pid:p.id,name:p.name,unit:p.unit,qty:q2(n),price:priceOf(p)};
  if(hasVar(p)){nl.vt=String(o.vt);nl.vc=String(o.vc||'');}
  if(pk){nl.pk=pk;nl.unit=isSoft(p.unit)?'pièce':'carton';nl.price=p.pricePk;}
  nl.name=lnName(p,nl);
  const ex=draft.lines.find(l=>l.pid&&lnKey(l)===lnKey(nl));
  const before=lnUsed(nl,draft.lines),av=lnAvail(nl);
  if(before+nl.qty*lnPk(nl)>av+1e-9){const left=Math.max(0,q2(av-before));
    toast(left>0?'Il reste seulement '+q2(left)+' '+p.unit+' de '+lnName(p,Object.assign({},nl,{pk:0})):'Stock fini : '+lnName(p,Object.assign({},nl,{pk:0}))+'. Ajoutez du stock');
    try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}return false;}
  if(ex)ex.qty=q2(ex.qty+nl.qty);else draft.lines.push(nl);
  if(expState(p)==='out')toast('Attention : '+p.name+' est périmé');return true;}
// Ligne d'une commande en ligne (avec taille/couleur si le client l'a choisie)
function webLine(l){const p=prod(l.id);const vv=!!(p&&hasVar(p)&&typeof l.vt==='string'&&vFind(p,l.vt,l.vc||''));
  const o={pid:p?p.id:null,name:vv?lnName(p,{vt:l.vt,vc:l.vc||''}):(p?p.name:l.nom),unit:p?p.unit:'pièce',qty:l.q,price:l.prix};
  if(vv){o.vt=l.vt;o.vc=l.vc||'';}return o;}

/* ---------- Choisir la taille / couleur (vente, commandes, échange) ---------- */
let VP=null;
function varPick(p,o,cb){o=o||{};VP={id:p.id,t:null,c:null,n:o.n>0?o.n:1,pk:0,cb:cb||null,ex:cb?(o.ex||[]):(draft?draft.lines:[]),title:o.title||p.name,not:o.not||null};
  const ts=uniqA(p.var.map(v=>v.t)),cs=uniqA(p.var.map(v=>v.c));if(ts.length===1)VP.t=ts[0];if(cs.length===1)VP.c=cs[0];vpPaint();}
function vpLeft(p,t,c,pk){const l={pid:p.id,vt:t,vc:c,qty:0};const v=vFind(p,t,c);if(!v)return 0;const left=Math.max(0,q2(v.q-lnUsed(l,VP.ex)));return pk?Math.floor(left/p.pack):left;}
function vpPaint(){const p=prod(VP&&VP.id);if(!p){closeSheet();return;}
  const ts=uniqA(p.var.map(v=>v.t)),cs=uniqA(p.var.map(v=>v.c)),hasC=cs.some(Boolean);const pk=VP.pk?p.pack:0;
  const leftT=t=>cs.reduce((a,c)=>a+vpLeft(p,t,c,pk),0);
  const ok=VP.t!=null&&VP.c!=null&&!(VP.not&&VP.not.t===VP.t&&VP.not.c===VP.c);const max=ok?vpLeft(p,VP.t,VP.c,pk):0;
  const soft=isSoft(p.unit)&&!VP.pk;const u=VP.pk?(isSoft(p.unit)?'pièce(s)':'carton(s)'):p.unit;
  const price=VP.pk?p.pricePk:priceOf(p);
  openSheet(VP.title,'<div class="card stack">'+
   '<div style="display:flex;gap:12px;align-items:center">'+(p.img?'<img src="'+esc(p.img)+'" alt="" style="width:64px;height:64px;border-radius:12px;object-fit:cover">':'')+'<div><b style="font-size:18px">'+esc(p.name)+'</b><div class="small">'+F(price)+' / '+esc(VP.pk?pkName(p):p.unit)+'</div></div></div>'+
   (ts.length>1||ts[0]!=='Unique'?'<div class="small"><b>'+(p.vk==='qualite'?'Qualité':'Taille')+'</b></div><div class="vpchips">'+ts.map(t=>{const n=leftT(t);return '<button type="button" class="vpc" data-vpt="'+esc(t)+'" aria-pressed="'+(VP.t===t)+'"'+(n<=0?' disabled':'')+'>'+esc(t)+' <small>('+q2(n)+')</small></button>';}).join('')+'</div>':'')+
   (hasC?'<div class="small"><b>Couleur</b></div><div class="vpchips">'+cs.map(c=>{const n=VP.t!=null?vpLeft(p,VP.t,c,pk):0;const same=VP.not&&VP.not.t===VP.t&&VP.not.c===c;return '<button type="button" class="vpc" data-vpc="'+esc(c)+'" aria-pressed="'+(VP.c===c)+'"'+(VP.t==null||n<=0||same?' disabled':'')+'>'+cdot(c)+esc(c||'—')+(VP.t!=null?' <small>('+q2(n)+')</small>':'')+'</button>';}).join('')+'</div>':'')+
   (canPk(p)&&!VP.cb?'<div class="seg"><button type="button" class="segb" data-vpk="0" aria-pressed="'+!VP.pk+'">'+(isSoft(p.unit)?'Au '+(p.unit==='m'?'mètre':p.unit):'À la pièce')+'</button><button type="button" class="segb" data-vpk="1" aria-pressed="'+!!VP.pk+'">'+(isSoft(p.unit)?'Pièce entière ('+q2(p.pack)+' '+p.unit+')':'Carton de '+q2(p.pack))+'</button></div>':'')+

  if(qi){qi.disabled=false;qi.readOnly=vfOn();if(vfOn())qi.value=String(vfTotal());const lb=qi.closest('label');if(lb&&lb.firstChild&&lb.firstChild.nodeType===3){if(!lb.dataset.lab0)lb.dataset.lab0=lb.firstChild.textContent;lb.firstChild.textContent=vfOn()?'Total (toutes les tailles) ↓':lb.dataset.lab0;}}

   (VF.t.length?'<div class="small"><b>Combien vous en avez pour chaque taille / couleur</b> ('+esc(unit)+') : écrivez le nombre de pièces dans chaque case</div><div class="vgrid" style="grid-template-columns:minmax(56px,auto) repeat('+cols.length+',minmax(54px,1fr))"><span></span>'+cols.map(c=>'<span class="h">'+cdot(c)+esc(c||'Qté')+'</span>').join('')+

function vfApply(p){if(!VF||!p){VF=null;return;}
  if(vfOn()){const cs=vfCols();p.var=[];VF.t.forEach(t=>cs.forEach(c=>p.var.push({t,c,q:Math.max(0,num(VF.q[t+'|'+c]||0))})));p.vk=VF.vk;
    if(VF.vk==='qualite'&&num(VF.pkLen)>0){p.pack=num(VF.pkLen);p.pricePk=num(VF.pkPrice);}varSync(p);}

function swapLine(lines,i,done){const l=lines[i];const p=l&&l.pid&&prod(l.pid);if(!p||!hasVar(p))return;
  varPick(p,{title:'Échanger : '+l.name,not:{t:l.vt,c:l.vc}},(t,c)=>{const v=vFind(p,t,c);const need=q2(l.qty*lnPk(l));
    if(!v||v.q<need)return toast('Pas assez en stock dans cette taille / couleur');
    lnMove(l,1);l.vt=t;l.vc=c;l.name=lnName(p,l);lnMove(l,-1);save();done&&done();toast('Échange fait : '+l.name);});}

/* ---------- Devis et factures en format A4 (tableau, total en lettres, signatures) ---------- */
function enLettres(n){n=Math.round(Math.abs(n));if(n===0)return 'zéro';
  const U=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const D=['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  const deux=(x,fin)=>{if(x<20)return U[x];const d=Math.floor(x/10),u=x%10;
    if(d===7||d===9){const r=10+u;return D[d]+(d===7&&u===1?'-et-':'-')+U[r];}
    if(u===0)return D[d]+(d===8&&fin?'s':'');return D[d]+(u===1&&d!==8?'-et-':'-')+U[u];};
  const trois=(x,fin)=>{const c=Math.floor(x/100),r=x%100;let s='';
    if(c)s=(c>1?U[c]+'-':'')+'cent'+(c>1&&r===0&&fin?'s':'');
    if(r)s+=(s?'-':'')+deux(r,fin);return s;};
  const parts=[];const mi=Math.floor(n/1e9),m=Math.floor(n/1e6)%1000,k=Math.floor(n/1000)%1000,r=n%1000;
  if(mi)parts.push(trois(mi,true)+'-milliard'+(mi>1?'s':''));
  if(m)parts.push(trois(m,true)+'-million'+(m>1?'s':''));
  if(k)parts.push(k===1?'mille':trois(k,false)+'-mille');
  if(r)parts.push(trois(r,true));
  return parts.join('-');}
function docA4(kind,s){const sh=S.shop||{},c=s.clientId?client(s.clientId):null,tel=(c&&c.phone)||s.phone||'';
  const col=(typeof BT_LOOK!=='undefined'&&BT_LOOK[btype()]||{col:'#1F4E9A'}).col,isQ=kind==='q';
  const titre=isQ?'DEVIS / PROFORMA':'FACTURE';
  const fmt=n=>Math.round(n||0).toLocaleString('fr-FR').replace(/\s/g,' ');
  const qty=q=>{const v=q2(q);return Number.isInteger(v)&&v<10?'0'+v:String(v).replace('.',',');};
  const typ=btype()!=='tout'&&BTY[btype()]?BTY[btype()].n:'';
  const logo=S.web&&typeof S.web.logo==='string'&&S.web.logo.startsWith('data:image/')?'<img src="'+esc(S.web.logo)+'" style="height:58px;max-width:120px;object-fit:contain;margin-bottom:4px" alt="">':'';
  const reste=isQ?0:Math.max(0,(s.total||0)-(s.paid||0));
  return '<style>#pdfArea .a4{padding:26px 30px 30px;font:14px/1.35 Arial,Helvetica,sans-serif;color:#111}'+
   '#pdfArea .a4 .hd{text-align:center;margin-bottom:12px}#pdfArea .a4 .nm{font:800 27px/1.1 Arial,sans-serif;color:'+col+';text-transform:uppercase;letter-spacing:.3px}'+
   '#pdfArea .a4 .pill{display:inline-block;background:'+col+';color:#fff;border-radius:99px;padding:4px 16px;font-weight:700;margin:6px 0 4px}'+
   '#pdfArea .a4 .inf{color:'+col+';font-weight:700;font-size:13.5px}#pdfArea .a4 .ad{color:'+col+';font-size:13px}'+
   '#pdfArea .a4 .tt{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}#pdfArea .a4 .tt b{font:800 22px Arial,sans-serif;color:'+col+'}'+
   '#pdfArea .a4 .no{color:#C0392B;font-weight:800;font-size:16px;text-align:right}#pdfArea .a4 .cl{margin:8px 0 10px;padding-bottom:8px;border-bottom:1px dashed #999;font-size:15px}'+
   '#pdfArea .a4 table{width:100%;border-collapse:collapse;border:2px solid '+col+'}#pdfArea .a4 th{background:#EAF1FB;color:'+col+';font-size:12px;padding:8px 6px;border:1px solid #9DB6DD;text-align:center}'+
   '#pdfArea .a4 td{border:1px solid #9DB6DD;padding:7px 8px;font-size:13.5px}#pdfArea .a4 td.c{text-align:center}#pdfArea .a4 td.n{text-align:right;white-space:nowrap}'+
   '#pdfArea .a4 .tot td{font-weight:800;color:'+col+';font-size:16px;border-top:2px solid '+col+'}#pdfArea .a4 .let{margin-top:14px;font-size:13.5px}'+
   '#pdfArea .a4 .sig{display:flex;justify-content:space-between;margin-top:46px;font-size:13px}</style>'+
   '<div class="a4"><div class="hd">'+logo+'<div class="nm">'+esc(sh.name||'')+'</div>'+(sh.owner?'<div class="pill">'+esc(sh.owner)+'</div>':'')+
   (typ?'<div class="inf">'+esc(typ)+'</div>':'')+(sh.phone?'<div class="inf">Tél : '+esc(sh.phone)+'</div>':'')+(sh.address?'<div class="ad">Adresse : '+esc(sh.address)+'</div>':'')+'</div>'+
   '<div class="tt"><b>'+titre+'</b><div><div style="text-align:right;font-size:13px">Date : '+fdate(s.date)+'</div><div class="no">N° '+String(s.no).padStart(6,'0')+'</div></div></div>'+
   '<div class="cl">'+(s.client?esc(s.client):'Client : ………………………')+(tel?' &nbsp;·&nbsp; Tél : '+esc(tel):'')+'</div>'+
   '<table><tr><th style="width:12%">QTÉ</th><th>DÉSIGNATION</th><th style="width:18%">P. UNIT</th><th style="width:19%">P. TOTAL</th></tr>'+
   s.lines.map(l=>'<tr><td class="c">'+qty(l.qty)+(l.unit&&!['pièce','carton'].includes(l.unit)?' '+esc(l.unit):'')+'</td><td>'+esc(l.name)+'</td><td class="n">'+fmt(l.price)+'</td><td class="n">'+fmt(l.qty*l.price)+'</td></tr>').join('')+
   '<tr class="tot"><td colspan="3" style="text-align:right">TOTAL</td><td class="n">'+fmt(s.total)+' F</td></tr>'+
   (!isQ&&reste>0?'<tr><td colspan="3" style="text-align:right">Payé ('+esc(s.mode||'')+')</td><td class="n">'+fmt(s.paid)+' F</td></tr><tr><td colspan="3" style="text-align:right;font-weight:800;color:#C0392B">RESTE À PAYER</td><td class="n" style="font-weight:800;color:#C0392B">'+fmt(reste)+' F</td></tr>':'')+
   '</table><div class="let">Arrêté'+(isQ?' le présent devis':'e la présente facture')+' à la somme de :<br><b>'+enLettres(s.total)+' francs CFA</b></div>'+
   (isQ?'<div class="let" style="color:#555">Devis valable 7 jours. Prix susceptibles de changer après.</div>':'')+
   '<div class="sig"><span>Le client</span><span>'+esc(sh.owner||sh.name||'')+'</span></div></div>';}
