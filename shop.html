<style>
/* Vitrine de boutique : bandeau vert Carnet, rayon d'articles en 2 colonnes comme une étagère, panier en bas */
:root{
  --bg:#F5F3EC; --surface:#FFFFFF; --ink:#13221D; --muted:#5B6862; --line:#E2DED3;
  --green:#0B6E5B; --green-deep:#084C3F; --yellow:#FCEE45; --yellow-soft:#FFF8C2;
  --bad:#B4361B; --wa:#1DA851;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs:16px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1714; --surface:#17221E; --ink:#ECF2EF; --muted:#A2B1AA; --line:#2A3832;
  --green:#3FB596; --green-deep:#0B3A30; --yellow:#FCEE45; --yellow-soft:#3A3A14; --bad:#FF8A6B; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1714; --surface:#17221E; --ink:#ECF2EF; --muted:#A2B1AA; --line:#2A3832;
  --green:#3FB596; --green-deep:#0B3A30; --yellow:#FCEE45; --yellow-soft:#3A3A14; --bad:#FF8A6B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.45;margin:0;padding-bottom:110px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.demo{background:var(--yellow);color:#2A2600;text-align:center;font-weight:800;font-size:calc(var(--fs)*.85);padding:9px 16px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px}

/* En-tête */
.hero{background:#0B6E5B;color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 16px,transparent 16px 32px)}
.hero .wrap{position:relative;padding-block:18px 22px;display:flex;flex-direction:column;gap:12px}
.tools{display:flex;justify-content:flex-end;gap:8px}
.tbtn{border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.id{display:flex;gap:14px;align-items:center}
.logo{width:64px;height:64px;border-radius:18px;background:#FCEE45;color:#0B4A3E;display:grid;place-items:center;font:800 26px var(--display);flex:none;box-shadow:0 6px 16px rgba(0,0,0,.2);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.vit{max-width:860px;margin:14px auto 0;padding-inline:16px}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:18px;scrollbar-width:none}.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;width:100%;aspect-ratio:16/9;object-fit:cover;scroll-snap-align:center;background:#eee}
.sdots{display:flex;justify-content:center;gap:6px;margin-top:8px}.sdots i{width:8px;height:8px;border-radius:50%;background:#c9d6d2}.sdots i.on{background:#0B6E5B}
.hero h1{font-size:clamp(28px,7vw,40px);font-weight:800;letter-spacing:-.02em}
.hero .txt{color:#DDF1EA;max-width:40em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-weight:700;font-size:calc(var(--fs)*.85)}

/* Barre de recherche et rayons */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:10px;display:flex;flex-direction:column;gap:10px}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;font:600 var(--fs) var(--body)}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;font-size:calc(var(--fs)*.9);white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Articles */
main.wrap{padding-block:16px}
.sec{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.sec h2{font-size:calc(var(--fs)*1.4);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative;min-width:0}
.card.out .pic img,.card.out .pic svg{filter:grayscale(1);opacity:.55}
.pic{aspect-ratio:1/1;background:var(--yellow-soft);display:block;width:100%;border:0;padding:0;position:relative}
.pic img,.pic svg{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;left:8px;border-radius:999px;padding:4px 10px;font-weight:800;font-size:calc(var(--fs)*.72)}
.b-out{background:var(--bad);color:#fff}
.b-promo{background:#FCEE45;color:#2A2600}
.b-new{background:#0B6E5B;color:#fff}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{font-family:var(--body);font-size:calc(var(--fs)*.95);font-weight:800;line-height:1.25}
.desc{color:var(--muted);font-size:calc(var(--fs)*.82);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{margin-top:auto;padding-top:6px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price{font:800 calc(var(--fs)*1.15) var(--display);font-variant-numeric:tabular-nums}
.old{color:var(--muted);text-decoration:line-through;font-size:calc(var(--fs)*.8);font-variant-numeric:tabular-nums}
.add{margin-top:8px;border:0;border-radius:12px;background:#0B6E5B;color:#fff;font-weight:800;padding:10px;min-height:44px}
.add:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.step{margin-top:8px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:var(--yellow-soft);border-radius:12px}
.step button{border:0;background:transparent;font:800 22px var(--body);min-height:44px;color:var(--ink)}
.step b{text-align:center;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

/* Panier en bas */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 75%,transparent)}
.cartbtn{width:100%;max-width:868px;margin:0 auto;display:flex;align-items:center;gap:12px;border:0;border-radius:18px;background:var(--wa);color:#fff;padding:14px 18px;font-weight:800;font-size:calc(var(--fs)*1.05);box-shadow:0 10px 26px rgba(29,168,81,.35)}
.cartbtn .n{background:#fff;color:#14622F;border-radius:999px;min-width:30px;height:30px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cartbtn .t{margin-left:auto;font-variant-numeric:tabular-nums}
.cartbtn:disabled{background:var(--line);color:var(--muted);box-shadow:none}
.cartbtn:disabled .n{background:var(--surface);color:var(--muted)}

/* Feuilles */
.shade{position:fixed;inset:0;z-index:40;background:rgba(5,15,12,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sh h2{font-size:calc(var(--fs)*1.35)}
.x{border:1.5px solid var(--line);background:transparent;border-radius:999px;width:40px;height:40px;font-size:20px;flex:none}
.line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:10px}
.line .nm{font-weight:700}
.line .sm{color:var(--muted);font-size:calc(var(--fs)*.85);font-variant-numeric:tabular-nums}
.line .step{margin:0;width:132px}
.tot{display:flex;justify-content:space-between;font:800 calc(var(--fs)*1.25) var(--display);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-weight:800;min-height:46px;font-size:calc(var(--fs)*.9)}
.seg button[aria-pressed="true"]{border-color:#0B6E5B;background:#0B6E5B;color:#fff}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:calc(var(--fs)*.9)}
label.f input,label.f textarea{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:600 var(--fs) var(--body)}
.ftitle{font-weight:800;font-size:calc(var(--fs)*.8);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.err{color:var(--bad);font-weight:700}
.send{border:0;border-radius:16px;background:var(--wa);color:#fff;font-weight:800;padding:16px;font-size:calc(var(--fs)*1.05);min-height:54px}
.big{width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:var(--yellow-soft)}
.big img,.big svg{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:flex;gap:8px}
.thumbs button{width:62px;height:62px;border-radius:12px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--yellow-soft)}
.thumbs button[aria-pressed="true"]{border-color:#0B6E5B}
.thumbs svg{width:100%;height:100%;display:block}
.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:calc(var(--fs)*.9)}
.note{color:var(--muted);font-size:calc(var(--fs)*.85)}
.vch{display:flex;flex-wrap:wrap;gap:8px}
.vc{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:800;min-height:46px}
.vc[aria-pressed="true"]{border-color:#0B6E5B;background:#0B6E5B;color:#fff}
.vc:disabled{opacity:.38;text-decoration:line-through;cursor:not-allowed}
.vdot{display:inline-block;width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.3);margin-right:6px;vertical-align:-1px}
footer{color:var(--muted);text-align:center;font-size:13px;padding:6px 16px 20px}
footer b{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.add,.cartbtn,.send{transition:transform .12s}.add:active,.cartbtn:active,.send:active{transform:scale(.97)}}
</style>
</head>
<body>

  const r=$('retry');if(r)r.onclick=()=>location.reload();}
async function boot(){
  if(!CODE||CODE==='DEMO'){D=EX;DEMO=true;$('demo').hidden=false;all();return;}
  $('nom').textContent='Chargement…';
  try{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),15000);
    const r=await fetch(SUPA_URL+'/rest/v1/rpc/boutique_page_public',{method:'POST',signal:ac.signal,headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_code:CODE})});
    clearTimeout(to);const j=await r.json();
    if(!r.ok||!j||!j.ok){if(j&&j.raison==='introuvable')return closed(t('Lien introuvable.'),'Vérifiez le lien reçu, ou demandez-le de nouveau au vendeur.');
      return closed('Boutique fermée pour le moment','Cette boutique en ligne n\'est pas disponible pour le moment. Contactez directement le vendeur.');}
    D={type:j.type||'tout',nom:j.nom||'Boutique',texte:j.texte||'',adresse:j.adresse||'',whatsapp:j.whatsapp||'',livraison:j.livraison!==false,retrait:j.retrait!==false,
       paiements:Array.isArray(j.paiements)?j.paiements:[],
       articles:(Array.isArray(j.articles)?j.articles:[]).filter(a=>a&&a.nom&&a.prix>0).map(a=>({id:String(a.id),nom:a.nom,cat:a.cat||'Articles',prix:+a.prix,old:+a.old||0,desc:a.desc||'',
         stock:a.stock===null||a.stock===undefined?null:+a.stock,nouveau:!!a.nouveau,unite:a.unite||'',vk:a.vk||'',
         var:Array.isArray(a.var)&&a.var.length?a.var.filter(v=>v&&typeof v.t==='string').map(v=>({t:v.t,c:String(v.c||''),q:v.q===null||v.q===undefined?null:+v.q})):null,img:(Array.isArray(a.img)?a.img:[]).filter(u=>typeof u==='string'&&/^(https:|data:image\/)/.test(u))}))};
    if(!D.livraison&&!D.retrait)D.livraison=true;
    D.zones=(Array.isArray(j.zones)?j.zones:[]).filter(z=>z&&z.n).map(z=>({n:String(z.n),p:+z.p||0}));
    D.articles.forEach(a=>{if(hasV(a)){const ts=[...new Set(a.var.filter(v=>v.q===null||v.q>0).map(v=>v.t))].filter(x=>x!=='Unique');if(ts.length)a.tailles=(a.vk==='qualite'?'':'Tailles : ')+ts.join(', ');}});
    if(j.logo!==undefined||j.photos!==undefined){D.logo=j.logo;D.photos=j.photos;}
    else{try{const v=await fetch(SUPA_URL+'/rest/v1/rpc/boutique_vitrine',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_code:CODE})});
      if(v.ok){const x=await v.json();if(x&&typeof x==='object'){D.logo=x.logo;D.photos=x.photos;}}}catch(e){}}
    DEMO=false;all();if(!D.articles.length)$('list').innerHTML='<p class="empty">Aucun article pour le moment. Revenez bientôt !</p>';}
  catch(e){closed(t('Pas de connexion internet.'),'Vérifiez internet et réessayez.',true);}}
boot();
</script>
